# A Python setup.cfg: configparser INI under a .cfg name, which macOS types as
# public.toml. It must get INI rules, not TOML's.
; Both comment styles start a line.

[metadata]
name = quicklooks-sample
version: 1.2.0
url = https://example.com/docs#install
description = Semicolons ; and hashes # stay part of an INI value

[options]
python_requires = >=3.9
install_requires =
    requests
    tomli; python_version < "3.11"

[paths]
cache = C:\tmp\cache
log_file = %(cache)s/app.log

[tool:pytest]
addopts = -ra --strict-markers
